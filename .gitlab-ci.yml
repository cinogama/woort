# WooRT GitLab CI/CD Configuration
# 支持平台：winserver22, mac-arm64, ubuntu22_arm64, ubuntu20
# 每个平台通过 matrix 拆分为 Debug 与 RelWithDebInfo 两个 case，构建与测试在同一 job 内完成。

stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

.test: &test
  stage: test
  before_script:
    - git submodule sync --recursive
    - git submodule update --init --recursive
  rules:
    - if: $CI_COMMIT_BRANCH

# ============================================
# Windows Server 2022（多配置生成器）
# ============================================
winserver22:
  <<: *test
  tags:
    - winserver22
  script:
    - cmake -B build -G "Visual Studio 18 2026" -A x64
    - cmake --build build --config %CONFIG%
    - ctest --test-dir build -C %CONFIG% --output-on-failure
  parallel:
    matrix:
      - CONFIG: [Debug, RelWithDebInfo]

# ============================================
# macOS ARM64（单配置生成器）
# ============================================
mac-arm64:
  <<: *test
  tags:
    - mac-arm64
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=$CONFIG -DCMAKE_OSX_ARCHITECTURES=arm64
    - cmake --build build -j$(sysctl -n hw.ncpu)
    - ctest --test-dir build --output-on-failure
  parallel:
    matrix:
      - CONFIG: [Debug, RelWithDebInfo]

# ============================================
# Ubuntu 22.04 ARM64（单配置生成器）
# ============================================
ubuntu22_arm64:
  <<: *test
  tags:
    - ubuntu22_arm64
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=$CONFIG
    - cmake --build build -j$(nproc)
    - ctest --test-dir build --output-on-failure
  parallel:
    matrix:
      - CONFIG: [Debug, RelWithDebInfo]

# ============================================
# Ubuntu 20.04（单配置生成器）
# ============================================
ubuntu20:
  <<: *test
  tags:
    - ubuntu20
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=$CONFIG
    - cmake --build build -j$(nproc)
    - ctest --test-dir build --output-on-failure
  parallel:
    matrix:
      - CONFIG: [Debug, RelWithDebInfo]
